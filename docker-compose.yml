services:
  app:
    build:
      context: ./app
    container_name: scenario75-app
    restart: unless-stopped
    environment:
      PORT: "3000"
      LAB_NAME: "Scenario75"
    expose:
      - "3000"
    volumes:
      - /opt/admin/logs:/opt/admin/logs

  nginx:
    image: nginx:1.27-alpine
    container_name: scenario75-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "3075:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/admin/logs:/opt/admin/logs
