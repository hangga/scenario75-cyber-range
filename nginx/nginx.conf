events {}

http {
    log_format scenario75 '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'xff="$http_x_forwarded_for"';

    access_log /opt/admin/logs/access.log scenario75;

    upstream scenario75_app {
        server app:3000;
    }

    server {
        listen 80;
        server_name feedback.admin.local _;

        location / {
            proxy_pass http://scenario75_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
